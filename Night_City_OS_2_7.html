var HPB={"Dense Marrow":3,"Titanium Bones":3,"Subdermal Armor":3,"Blood Pump":2,"Second Heart":4};
function hpImp(c){return(c.imp||[]).reduce(function(t,x){return t+(HPB[x.n]||0)*x.t},0)}
function hpMax(c){return 30+(c.a.POT||0)*5+(c.s["Resistência Física"]||0)*3+hpImp(c)}

 if(w/h>A)h=w/A;else w=h*A;var cx=(x0+x1)/2,cy=(y0+y1)/2;return[Math.max(0,Math.min(1157-w,cx-w/2)),Math.max(0,Math.min(1359-h,cy-h/2)),w,h]}
function mapPg(){var vb=vbFor(mapSel);
 return'<div class="p"><h2>Night City</h2><svg id="msv" class="'+(mapSel?'sel':'')+'" viewBox="'+vb.join(' ')+'" style="width:100%;aspect-ratio:1157/1359;display:block;background:#000"><image href="'+MAPIMG+'" width="1157" height="1359"/>'+Object.keys(MAPD).map(function(id){var d=MAPD[id];return'<polygon class="dz'+(id===mapSel?' on':'')+'" data-id="'+id+'" points="'+d.p.map(function(q){return q.join(',')}).join(' ')+'" style="--c:'+d.c+'" onclick="mapGo(\''+id+'\')"/>'}).join('')+'</svg></div><div class="p" id="mapi">'+mapInfo()+'</div>'}
function mapGo(id){var sv=$("msv"),a=sv.getAttribute("viewBox").split(" ").map(Number),b=vbFor(id),t0=performance.now();mapSel=id;sv.classList.toggle("sel",!!id);
 [].forEach.call(sv.querySelectorAll(".dz"),function(z){z.classList.toggle("on",z.getAttribute("data-id")===id)});
 (function f(t){var k=Math.min(1,(t-t0)/550),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;sv.setAttribute("viewBox",a.map(function(v,i){return v+(b[i]-v)*e}).join(" "));if(k<1)requestAnimationFrame(f)})(t0);
 $("mapi").innerHTML=mapInfo()}
